title: 'A Six-Functor Formalism for Solid Sheaves in Spectral Algebraic Geometry'
titlePlain: 'A Six-Functor Formalism for Solid Sheaves in Spectral Algebraic Geometry'
status: preprint
description: >- 
  MS Thesis, Rheinische Friedrich-Wilhelms-Universität Bonn, 2026. 
abstract: >-
  We develop a theory of analytic rings relative to connective $\mathbb{E}_{\infty}$-algebras in condensed spectra and apply it to the construction of a six-functor formalism for solid quasicoherent sheaves on spectral algebraic stacks. This extends work of Clausen-Scholze in the case of static rings, and of Hansen-Mann, L. Mann, and Rodríguez Camargo in the animated setting.
